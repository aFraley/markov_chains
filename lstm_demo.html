<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LSTM Name Generator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Menlo', 'Consolas', 'Courier New', monospace;
    background: #1a1a2e;
    color: #e0e0e0;
    min-height: 100vh;
    padding: 2rem;
  }
  h1 {
    text-align: center;
    color: #e94560;
    font-size: 1.6rem;
    margin-bottom: 0.3rem;
  }
  .subtitle {
    text-align: center;
    color: #888;
    font-size: 0.85rem;
    margin-bottom: 2rem;
  }
  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 2rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
  }
  .slider-group {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .slider-group label { color: #aaa; font-size: 0.85rem; }
  .slider-group input[type="range"] {
    width: 180px;
    accent-color: #e94560;
  }
  .slider-group .temp-val {
    color: #e94560;
    font-weight: bold;
    min-width: 2.5em;
  }
  button {
    background: #e94560;
    color: #fff;
    border: none;
    padding: 0.6rem 2rem;
    font-family: inherit;
    font-size: 0.95rem;
    cursor: pointer;
    border-radius: 4px;
    transition: background 0.15s;
  }
  button:hover { background: #c73650; }
  button:disabled { background: #555; cursor: not-allowed; }
  .columns {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
    max-width: 900px;
    margin: 0 auto;
  }
  .column h2 {
    color: #e94560;
    font-size: 1.05rem;
    margin-bottom: 0.8rem;
    border-bottom: 1px solid #333;
    padding-bottom: 0.4rem;
  }
  .column ul {
    list-style: none;
    min-height: 200px;
  }
  .column li {
    padding: 0.3rem 0;
    color: #d0d0d0;
    font-size: 0.95rem;
  }
  .column li::before {
    content: '> ';
    color: #555;
  }
  .loading {
    text-align: center;
    color: #888;
    font-size: 0.85rem;
    margin-top: 1rem;
  }
  @media (max-width: 640px) {
    .columns { grid-template-columns: 1fr; }
    body { padding: 1rem; }
  }
</style>
</head>
<body>

<h1>LSTM Name Generator</h1>
<p class="subtitle">Character-level LSTM inference running in the browser &mdash; 4 gates, cell state, no frameworks</p>

<div class="controls">
  <div class="slider-group">
    <label for="temp">Temperature:</label>
    <input type="range" id="temp" min="0.3" max="1.5" step="0.05" value="0.8">
    <span class="temp-val" id="temp-val">0.80</span>
  </div>
  <button id="gen-btn" disabled>Loading weights...</button>
</div>

<div class="columns">
  <div class="column">
    <h2>Greek</h2>
    <ul id="list-greek"></ul>
  </div>
  <div class="column">
    <h2>Norse</h2>
    <ul id="list-norse"></ul>
  </div>
  <div class="column">
    <h2>Celtic</h2>
    <ul id="list-celtic"></ul>
  </div>
</div>

<p class="loading" id="status">Loading weights...</p>

<script>
// ── Matrix utilities ──────────────────────────────────────────────

function matmul(A, B) {
  var rows = A.length, inner = B.length, cols = B[0].length;
  var C = Array.from({ length: rows }, function() { return new Float64Array(cols); });
  for (var i = 0; i < rows; i++)
    for (var k = 0; k < inner; k++)
      for (var j = 0; j < cols; j++)
        C[i][j] += A[i][k] * B[k][j];
  return C;
}

function matadd(A, B) {
  return A.map(function(row, i) { return row.map(function(v, j) { return v + B[i][j]; }); });
}

function sigmoid(M) {
  return M.map(function(row) { return row.map(function(v) {
    if (v >= 0) { var e = Math.exp(-v); return 1 / (1 + e); }
    else { var e = Math.exp(v); return e / (1 + e); }
  }); });
}

function tanhM(M) {
  return M.map(function(row) { return row.map(function(v) { return Math.tanh(v); }); });
}

function elemMul(A, B) {
  return A.map(function(row, i) { return row.map(function(v, j) { return v * B[i][j]; }); });
}

function softmax(logits, temperature) {
  var scaled = logits.map(function(row) { return row.map(function(v) { return v / temperature; }); });
  var max = -Infinity;
  for (var r = 0; r < scaled.length; r++)
    for (var c = 0; c < scaled[r].length; c++)
      if (scaled[r][c] > max) max = scaled[r][c];
  var exps = scaled.map(function(row) { return row.map(function(v) { return Math.exp(v - max); }); });
  var sum = 0;
  for (var r = 0; r < exps.length; r++)
    for (var c = 0; c < exps[r].length; c++)
      sum += exps[r][c];
  return exps.map(function(row) { return row.map(function(v) { return v / sum; }); });
}

// ── LSTM Sampling ────────────────────────────────────────────────

function lstmSample(model, vocab, temperature) {
  var char_to_ix = vocab.char_to_ix;
  var ix_to_char = vocab.ix_to_char;
  var vocab_size = vocab.vocab_size;
  var hiddenSize = model.W_hf.length;

  var h = Array.from({ length: hiddenSize }, function() { return [0]; });
  var c = Array.from({ length: hiddenSize }, function() { return [0]; });

  var ix = char_to_ix['^'];
  var chars = [];
  var maxLen = 20;

  for (var step = 0; step < maxLen; step++) {
    // One-hot column vector
    var x = Array.from({ length: vocab_size }, function(_, i) { return [i === ix ? 1 : 0]; });

    // LSTM gates
    // f = sigmoid(W_xf @ x + W_hf @ h + b_f)
    var f = sigmoid(matadd(matadd(matmul(model.W_xf, x), matmul(model.W_hf, h)), model.b_f));
    // i = sigmoid(W_xi @ x + W_hi @ h + b_i)
    var ig = sigmoid(matadd(matadd(matmul(model.W_xi, x), matmul(model.W_hi, h)), model.b_i));
    // g = tanh(W_xg @ x + W_hg @ h + b_g)
    var g = tanhM(matadd(matadd(matmul(model.W_xg, x), matmul(model.W_hg, h)), model.b_g));
    // c = f * c_prev + i * g
    c = matadd(elemMul(f, c), elemMul(ig, g));
    // o = sigmoid(W_xo @ x + W_ho @ h + b_o)
    var o = sigmoid(matadd(matadd(matmul(model.W_xo, x), matmul(model.W_ho, h)), model.b_o));
    // h = o * tanh(c)
    h = elemMul(o, tanhM(c));

    // Output
    var y = matadd(matmul(model.W_hy, h), model.b_y);
    var p = softmax(y, temperature);

    // Sample from distribution
    var r = Math.random();
    var cum = 0;
    ix = 0;
    for (var i = 0; i < vocab_size; i++) {
      cum += p[i][0];
      if (r < cum) { ix = i; break; }
    }

    var ch = ix_to_char[String(ix)];
    if (ch === '$') break;
    chars.push(ch);
  }

  if (chars.length === 0) return '';
  return chars[0].toUpperCase() + chars.slice(1).join('');
}

// ── App ───────────────────────────────────────────────────────────

var weights = null;
var categories = ['greek', 'norse', 'celtic'];

var tempSlider = document.getElementById('temp');
var tempVal = document.getElementById('temp-val');
var genBtn = document.getElementById('gen-btn');
var status = document.getElementById('status');

tempSlider.addEventListener('input', function() {
  tempVal.textContent = parseFloat(tempSlider.value).toFixed(2);
});

function clearEl(el) {
  while (el.firstChild) el.removeChild(el.firstChild);
}

function generate() {
  var temperature = parseFloat(tempSlider.value);
  for (var ci = 0; ci < categories.length; ci++) {
    var cat = categories[ci];
    var ul = document.getElementById('list-' + cat);
    clearEl(ul);
    for (var i = 0; i < 8; i++) {
      var name = lstmSample(weights.models[cat], weights.vocab, temperature);
      if (name) {
        var li = document.createElement('li');
        li.textContent = name;
        ul.appendChild(li);
      }
    }
  }
}

genBtn.addEventListener('click', generate);

fetch('lstm_weights.json')
  .then(function(r) { return r.json(); })
  .then(function(data) {
    weights = data;
    genBtn.disabled = false;
    genBtn.textContent = 'Generate';
    status.textContent = 'Loaded: ' + data.vocab.vocab_size + ' vocab, ' +
      data.hidden_size + ' hidden, ' + categories.length + ' models';
    generate();
  })
  .catch(function(err) {
    status.textContent = 'Failed to load weights: ' + err.message;
  });
</script>
</body>
</html>
