<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transformer Name Generator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Menlo', 'Consolas', 'Courier New', monospace;
    background: #1a1a2e;
    color: #e0e0e0;
    min-height: 100vh;
    padding: 2rem;
  }
  h1 {
    text-align: center;
    color: #e94560;
    font-size: 1.6rem;
    margin-bottom: 0.3rem;
  }
  .subtitle {
    text-align: center;
    color: #888;
    font-size: 0.85rem;
    margin-bottom: 2rem;
  }
  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 2rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
  }
  .slider-group {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .slider-group label { color: #aaa; font-size: 0.85rem; }
  .slider-group input[type="range"] {
    width: 180px;
    accent-color: #e94560;
  }
  .slider-group .temp-val {
    color: #e94560;
    font-weight: bold;
    min-width: 2.5em;
  }
  button {
    background: #e94560;
    color: #fff;
    border: none;
    padding: 0.6rem 2rem;
    font-family: inherit;
    font-size: 0.95rem;
    cursor: pointer;
    border-radius: 4px;
    transition: background 0.15s;
  }
  button:hover { background: #c73650; }
  button:disabled { background: #555; cursor: not-allowed; }
  .columns {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
    max-width: 900px;
    margin: 0 auto;
  }
  .column h2 {
    color: #e94560;
    font-size: 1.05rem;
    margin-bottom: 0.8rem;
    border-bottom: 1px solid #333;
    padding-bottom: 0.4rem;
  }
  .column ul {
    list-style: none;
    min-height: 200px;
  }
  .column li {
    padding: 0.3rem 0;
    color: #d0d0d0;
    font-size: 0.95rem;
  }
  .column li::before {
    content: '> ';
    color: #555;
  }
  .attn-section {
    max-width: 900px;
    margin: 2rem auto 0;
  }
  .attn-section h2 {
    color: #e94560;
    font-size: 1.05rem;
    margin-bottom: 0.8rem;
    border-bottom: 1px solid #333;
    padding-bottom: 0.4rem;
  }
  .attn-heads {
    display: flex;
    gap: 2rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .attn-head { text-align: center; }
  .attn-head .head-label {
    color: #aaa;
    font-size: 0.8rem;
    margin-bottom: 0.5rem;
  }
  .attn-grid {
    display: inline-block;
  }
  .attn-grid table {
    border-collapse: collapse;
  }
  .attn-grid td {
    width: 28px;
    height: 28px;
    text-align: center;
    font-size: 0.65rem;
    border: 1px solid #2a2a4a;
  }
  .attn-grid th {
    font-size: 0.7rem;
    padding: 2px 4px;
    color: #e94560;
    font-weight: normal;
  }
  .attn-name-label {
    color: #888;
    font-size: 0.8rem;
    margin-top: 0.5rem;
    text-align: center;
  }
  .loading {
    text-align: center;
    color: #888;
    font-size: 0.85rem;
    margin-top: 1rem;
  }
  @media (max-width: 640px) {
    .columns { grid-template-columns: 1fr; }
    body { padding: 1rem; }
  }
</style>
</head>
<body>

<h1>Transformer Name Generator</h1>
<p class="subtitle">Decoder-only transformer with multi-head causal self-attention &mdash; running entirely in the browser</p>

<div class="controls">
  <div class="slider-group">
    <label for="temp">Temperature:</label>
    <input type="range" id="temp" min="0.3" max="1.5" step="0.05" value="0.8">
    <span class="temp-val" id="temp-val">0.80</span>
  </div>
  <button id="gen-btn" disabled>Loading weights...</button>
</div>

<div class="columns">
  <div class="column">
    <h2>Greek</h2>
    <ul id="list-greek"></ul>
  </div>
  <div class="column">
    <h2>Norse</h2>
    <ul id="list-norse"></ul>
  </div>
  <div class="column">
    <h2>Celtic</h2>
    <ul id="list-celtic"></ul>
  </div>
</div>

<div class="attn-section">
  <h2>Attention Patterns (last generated name per category)</h2>
  <div class="attn-heads" id="attn-display"></div>
</div>

<p class="loading" id="status">Loading weights...</p>

<script>
// ── Matrix utilities (2D: arrays of Float64Array) ─────────────────

function zeros(rows, cols) {
  return Array.from({ length: rows }, function() { return new Float64Array(cols); });
}

// (M, N) x (N, P) -> (M, P)
function matmul(A, B) {
  var M = A.length, N = B.length, P = B[0].length;
  var C = zeros(M, P);
  for (var i = 0; i < M; i++)
    for (var k = 0; k < N; k++)
      for (var j = 0; j < P; j++)
        C[i][j] += A[i][k] * B[k][j];
  return C;
}

// Transpose (M, N) -> (N, M)
function transpose(A) {
  var M = A.length, N = A[0].length;
  var T = zeros(N, M);
  for (var i = 0; i < M; i++)
    for (var j = 0; j < N; j++)
      T[j][i] = A[i][j];
  return T;
}

// Add bias (1D array) to each row of (T, D)
function addBias(A, b) {
  return A.map(function(row) { return row.map(function(v, j) { return v + b[j]; }); });
}

// ── Layer Norm ────────────────────────────────────────────────────

function layerNorm(X, gamma, beta) {
  var eps = 1e-5;
  return X.map(function(row) {
    var D = row.length;
    var mean = 0;
    for (var i = 0; i < D; i++) mean += row[i];
    mean /= D;
    var variance = 0;
    for (var i = 0; i < D; i++) variance += (row[i] - mean) * (row[i] - mean);
    variance /= D;
    var invStd = 1 / Math.sqrt(variance + eps);
    return row.map(function(v, i) { return gamma[i] * ((v - mean) * invStd) + beta[i]; });
  });
}

// ── Multi-Head Causal Self-Attention ──────────────────────────────

function attention(X, model, nHeads) {
  var T = X.length;
  var dModel = X[0].length;
  var dK = dModel / nHeads;

  // Q, K, V projections: (T, dModel)
  var Q = addBias(matmul(X, model.W_Q), model.b_Q);
  var K = addBias(matmul(X, model.W_K), model.b_K);
  var V = addBias(matmul(X, model.W_V), model.b_V);

  // Split into heads and compute attention per head
  var allAttnWeights = [];  // for visualization
  var headOutputs = [];     // (nHeads, T, dK)

  for (var h = 0; h < nHeads; h++) {
    // Extract head slice: (T, dK)
    var Qh = Q.map(function(row) { return Array.from(row.slice(h * dK, (h + 1) * dK)); });
    var Kh = K.map(function(row) { return Array.from(row.slice(h * dK, (h + 1) * dK)); });
    var Vh = V.map(function(row) { return Array.from(row.slice(h * dK, (h + 1) * dK)); });

    // Scores: Q @ K^T / sqrt(dK)  -> (T, T)
    var KhT = transpose(Kh);
    var scores = matmul(Qh, KhT);
    var scale = 1 / Math.sqrt(dK);
    for (var i = 0; i < T; i++)
      for (var j = 0; j < T; j++) {
        scores[i][j] *= scale;
        if (j > i) scores[i][j] = -1e9;  // causal mask
      }

    // Softmax per row
    var attn = scores.map(function(row) {
      var max = -Infinity;
      for (var i = 0; i < row.length; i++) if (row[i] > max) max = row[i];
      var exps = row.map(function(v) { return Math.exp(v - max); });
      var sum = 0;
      for (var i = 0; i < exps.length; i++) sum += exps[i];
      return exps.map(function(v) { return v / sum; });
    });
    allAttnWeights.push(attn);

    // Weighted sum: attn @ V -> (T, dK)
    headOutputs.push(matmul(attn, Vh));
  }

  // Concatenate heads: (T, dModel)
  var concat = zeros(T, dModel);
  for (var h = 0; h < nHeads; h++)
    for (var t = 0; t < T; t++)
      for (var k = 0; k < dK; k++)
        concat[t][h * dK + k] = headOutputs[h][t][k];

  // Output projection
  var out = addBias(matmul(concat, model.W_O), model.b_O);
  return { out: out, attnWeights: allAttnWeights };
}

// ── FFN ───────────────────────────────────────────────────────────

function ffn(X, model) {
  // ReLU(X @ W1 + b1) @ W2 + b2
  var hidden = addBias(matmul(X, model.W1), model.b1);
  // ReLU
  hidden = hidden.map(function(row) { return row.map(function(v) { return v > 0 ? v : 0; }); });
  return addBias(matmul(hidden, model.W2), model.b2);
}

// ── Full Transformer Forward ──────────────────────────────────────

function transformerForward(indices, model, config) {
  var T = indices.length;

  // Embedding lookup + positional encoding
  var X = zeros(T, config.dModel);
  for (var t = 0; t < T; t++)
    for (var d = 0; d < config.dModel; d++)
      X[t][d] = model.W_emb[indices[t]][d] + model.PE[t][d];

  // Pre-norm block 1: LayerNorm -> Attention -> Residual
  var Xnorm = layerNorm(X, model.gamma_1, model.beta_1);
  var attnResult = attention(Xnorm, model, config.nHeads);
  for (var t = 0; t < T; t++)
    for (var d = 0; d < config.dModel; d++)
      X[t][d] += attnResult.out[t][d];

  // Pre-norm block 2: LayerNorm -> FFN -> Residual
  Xnorm = layerNorm(X, model.gamma_2, model.beta_2);
  var ffnOut = ffn(Xnorm, model);
  for (var t = 0; t < T; t++)
    for (var d = 0; d < config.dModel; d++)
      X[t][d] += ffnOut[t][d];

  // Final LayerNorm -> Output projection
  var Xfinal = layerNorm(X, model.gamma_f, model.beta_f);
  var logits = addBias(matmul(Xfinal, model.W_out), model.b_out);

  return { logits: logits, attnWeights: attnResult.attnWeights };
}

// ── Sampling ──────────────────────────────────────────────────────

function transformerSample(model, vocab, config, temperature) {
  var startIx = vocab.char_to_ix['^'];
  var indices = [startIx];
  var chars = [];
  var lastAttnWeights = null;

  for (var step = 0; step < 20; step++) {
    var result = transformerForward(indices, model, config);
    lastAttnWeights = result.attnWeights;

    // Get logits for last position
    var lastLogits = result.logits[result.logits.length - 1];

    // Temperature-scaled softmax
    var scaled = lastLogits.map(function(v) { return v / temperature; });
    var max = -Infinity;
    for (var i = 0; i < scaled.length; i++) if (scaled[i] > max) max = scaled[i];
    var exps = scaled.map(function(v) { return Math.exp(v - max); });
    var sum = 0;
    for (var i = 0; i < exps.length; i++) sum += exps[i];
    var probs = exps.map(function(v) { return v / sum; });

    // Sample
    var r = Math.random();
    var cum = 0;
    var ix = 0;
    for (var i = 0; i < probs.length; i++) {
      cum += probs[i];
      if (r < cum) { ix = i; break; }
    }

    var ch = vocab.ix_to_char[String(ix)];
    if (ch === '$') break;
    chars.push(ch);
    indices.push(ix);
  }

  var name = '';
  if (chars.length > 0) name = chars[0].toUpperCase() + chars.slice(1).join('');
  return { name: name, attnWeights: lastAttnWeights, indices: indices };
}

// ── Attention Heatmap Rendering ───────────────────────────────────

function heatColor(value) {
  // 0 = dark blue, 1 = bright red
  var r = Math.round(233 * value);
  var g = Math.round(40 * (1 - value));
  var b = Math.round(96 * (1 - value) + 30);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function renderAttention(container, attnWeights, indices, vocab, category) {
  var chars = indices.map(function(ix) { return vocab.ix_to_char[String(ix)]; });

  for (var h = 0; h < attnWeights.length; h++) {
    var headDiv = document.createElement('div');
    headDiv.className = 'attn-head';

    var label = document.createElement('div');
    label.className = 'head-label';
    label.textContent = category + ' \u2014 Head ' + h;
    headDiv.appendChild(label);

    var gridDiv = document.createElement('div');
    gridDiv.className = 'attn-grid';
    var table = document.createElement('table');

    // Header row
    var thead = document.createElement('tr');
    var corner = document.createElement('th');
    thead.appendChild(corner);
    for (var j = 0; j < chars.length; j++) {
      var th = document.createElement('th');
      th.textContent = chars[j];
      thead.appendChild(th);
    }
    table.appendChild(thead);

    // Data rows
    var weights = attnWeights[h];
    for (var i = 0; i < chars.length; i++) {
      var tr = document.createElement('tr');
      var rowLabel = document.createElement('th');
      rowLabel.textContent = chars[i];
      tr.appendChild(rowLabel);
      for (var j = 0; j < chars.length; j++) {
        var td = document.createElement('td');
        var w = weights[i][j];
        td.style.background = heatColor(w);
        td.style.color = w > 0.5 ? '#fff' : '#aaa';
        td.textContent = w > 0.01 ? w.toFixed(2) : '.';
        td.title = chars[i] + ' \u2192 ' + chars[j] + ': ' + w.toFixed(4);
        tr.appendChild(td);
      }
      table.appendChild(tr);
    }

    gridDiv.appendChild(table);
    headDiv.appendChild(gridDiv);
    container.appendChild(headDiv);
  }
}

// ── App ───────────────────────────────────────────────────────────

var weights = null;
var config = null;
var categories = ['greek', 'norse', 'celtic'];

var tempSlider = document.getElementById('temp');
var tempVal = document.getElementById('temp-val');
var genBtn = document.getElementById('gen-btn');
var statusEl = document.getElementById('status');
var attnDisplay = document.getElementById('attn-display');

tempSlider.addEventListener('input', function() {
  tempVal.textContent = parseFloat(tempSlider.value).toFixed(2);
});

function clearEl(el) {
  while (el.firstChild) el.removeChild(el.firstChild);
}

function generate() {
  var temperature = parseFloat(tempSlider.value);
  clearEl(attnDisplay);

  for (var ci = 0; ci < categories.length; ci++) {
    var cat = categories[ci];
    var ul = document.getElementById('list-' + cat);
    clearEl(ul);
    var lastResult = null;

    for (var i = 0; i < 8; i++) {
      var result = transformerSample(weights.models[cat], weights.vocab, config, temperature);
      if (result.name) {
        var li = document.createElement('li');
        li.textContent = result.name;
        ul.appendChild(li);
        if (!lastResult && result.indices.length > 2) lastResult = result;
      }
    }

    // Show attention for one name per category (head 0 only to save space)
    if (lastResult) {
      renderAttention(attnDisplay, [lastResult.attnWeights[0]], lastResult.indices, weights.vocab, cat);
    }
  }
}

genBtn.addEventListener('click', generate);

fetch('transformer_weights.json')
  .then(function(r) { return r.json(); })
  .then(function(data) {
    weights = data;
    config = { dModel: data.d_model, nHeads: data.n_heads, dFF: data.d_ff };
    genBtn.disabled = false;
    genBtn.textContent = 'Generate';
    statusEl.textContent = 'Loaded: ' + data.vocab.vocab_size + ' vocab, d_model=' +
      data.d_model + ', ' + data.n_heads + ' heads, ' + categories.length + ' models';
    generate();
  })
  .catch(function(err) {
    statusEl.textContent = 'Failed to load weights: ' + err.message;
  });
</script>
</body>
</html>
