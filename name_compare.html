<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Name Generator Comparison</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Menlo', 'Consolas', 'Courier New', monospace;
    background: #1a1a2e;
    color: #e0e0e0;
    min-height: 100vh;
    padding: 2rem;
  }
  h1 {
    text-align: center;
    color: #e94560;
    font-size: 1.6rem;
    margin-bottom: 0.3rem;
  }
  .subtitle {
    text-align: center;
    color: #888;
    font-size: 0.85rem;
    margin-bottom: 2rem;
  }
  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 2rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
  }
  .slider-group {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .slider-group label { color: #aaa; font-size: 0.85rem; }
  .slider-group input[type="range"] {
    width: 180px;
    accent-color: #e94560;
  }
  .slider-group .temp-val {
    color: #e94560;
    font-weight: bold;
    min-width: 2.5em;
  }
  button {
    background: #e94560;
    color: #fff;
    border: none;
    padding: 0.6rem 2rem;
    font-family: inherit;
    font-size: 0.95rem;
    cursor: pointer;
    border-radius: 4px;
    transition: background 0.15s;
  }
  button:hover { background: #c73650; }
  button:disabled { background: #555; cursor: not-allowed; }

  .grid {
    display: grid;
    grid-template-columns: auto 1fr 1fr 1fr 1fr 1fr;
    gap: 0;
    max-width: 1400px;
    margin: 0 auto;
  }
  .grid-header {
    color: #e94560;
    font-size: 0.85rem;
    font-weight: bold;
    padding: 0.5rem 0.7rem;
    border-bottom: 1px solid #333;
    text-align: center;
  }
  .grid-header:first-child { text-align: right; }
  .row-label {
    color: #e94560;
    font-size: 0.95rem;
    font-weight: bold;
    padding: 0.8rem 0.7rem 0.8rem 0;
    text-align: right;
    text-transform: uppercase;
    border-right: 1px solid #333;
    display: flex;
    align-items: flex-start;
    justify-content: flex-end;
    padding-top: 1rem;
  }
  .cell {
    padding: 0.4rem 0.7rem;
    min-height: 200px;
  }
  .cell ul {
    list-style: none;
  }
  .cell li {
    padding: 0.2rem 0;
    color: #d0d0d0;
    font-size: 0.85rem;
  }
  .cell li::before {
    content: '> ';
    color: #555;
  }
  .loading {
    text-align: center;
    color: #888;
    font-size: 0.85rem;
    margin-top: 1rem;
  }
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
    .grid-header { text-align: left; }
    .row-label {
      text-align: left;
      border-right: none;
      border-bottom: 1px solid #333;
      justify-content: flex-start;
      padding: 0.8rem 0;
    }
    .cell { padding: 0.4rem 0; }
    body { padding: 1rem; }
  }
</style>
</head>
<body>

<h1>Name Generator &mdash; All 5 Methods</h1>
<p class="subtitle">Order-1 Markov &middot; Order-3 Markov &middot; RNN &middot; LSTM &middot; Transformer &mdash; side by side</p>

<div class="controls">
  <div class="slider-group">
    <label for="temp">Neural Net Temperature:</label>
    <input type="range" id="temp" min="0.3" max="1.5" step="0.05" value="0.8">
    <span class="temp-val" id="temp-val">0.80</span>
  </div>
  <button id="gen-btn" disabled>Loading...</button>
</div>

<div class="grid">
  <!-- Header row -->
  <div class="grid-header"></div>
  <div class="grid-header">Order-1 Markov</div>
  <div class="grid-header">Order-3 Markov</div>
  <div class="grid-header" id="rnn-header">RNN</div>
  <div class="grid-header" id="lstm-header">LSTM</div>
  <div class="grid-header" id="tf-header">Transformer</div>

  <!-- Greek row -->
  <div class="row-label">Greek</div>
  <div class="cell"><ul id="o1-greek"></ul></div>
  <div class="cell"><ul id="o3-greek"></ul></div>
  <div class="cell"><ul id="rnn-greek"></ul></div>
  <div class="cell"><ul id="lstm-greek"></ul></div>
  <div class="cell"><ul id="tf-greek"></ul></div>

  <!-- Norse row -->
  <div class="row-label">Norse</div>
  <div class="cell"><ul id="o1-norse"></ul></div>
  <div class="cell"><ul id="o3-norse"></ul></div>
  <div class="cell"><ul id="rnn-norse"></ul></div>
  <div class="cell"><ul id="lstm-norse"></ul></div>
  <div class="cell"><ul id="tf-norse"></ul></div>

  <!-- Celtic row -->
  <div class="row-label">Celtic</div>
  <div class="cell"><ul id="o1-celtic"></ul></div>
  <div class="cell"><ul id="o3-celtic"></ul></div>
  <div class="cell"><ul id="rnn-celtic"></ul></div>
  <div class="cell"><ul id="lstm-celtic"></ul></div>
  <div class="cell"><ul id="tf-celtic"></ul></div>
</div>

<p class="loading" id="status">Loading data...</p>

<script>
// =====================================================================
// Matrix utilities (column-vector style for RNN/LSTM)
// =====================================================================

function matmul(A, B) {
  var rows = A.length, inner = B.length, cols = B[0].length;
  var C = Array.from({ length: rows }, function() { return new Float64Array(cols); });
  for (var i = 0; i < rows; i++)
    for (var k = 0; k < inner; k++)
      for (var j = 0; j < cols; j++)
        C[i][j] += A[i][k] * B[k][j];
  return C;
}

function matadd(A, B) {
  return A.map(function(row, i) { return row.map(function(v, j) { return v + B[i][j]; }); });
}

function tanhM(M) {
  return M.map(function(row) { return row.map(function(v) { return Math.tanh(v); }); });
}

function sigmoidM(M) {
  return M.map(function(row) { return row.map(function(v) {
    if (v >= 0) { var e = Math.exp(-v); return 1 / (1 + e); }
    else { var e = Math.exp(v); return e / (1 + e); }
  }); });
}

function elemMul(A, B) {
  return A.map(function(row, i) { return row.map(function(v, j) { return v * B[i][j]; }); });
}

function colSoftmax(logits, temperature) {
  var scaled = logits.map(function(row) { return row.map(function(v) { return v / temperature; }); });
  var max = -Infinity;
  for (var r = 0; r < scaled.length; r++)
    for (var c = 0; c < scaled[r].length; c++)
      if (scaled[r][c] > max) max = scaled[r][c];
  var exps = scaled.map(function(row) { return row.map(function(v) { return Math.exp(v - max); }); });
  var sum = 0;
  for (var r = 0; r < exps.length; r++)
    for (var c = 0; c < exps[r].length; c++)
      sum += exps[r][c];
  return exps.map(function(row) { return row.map(function(v) { return v / sum; }); });
}

function sampleFromCol(p, vocabSize) {
  var r = Math.random(), cum = 0;
  for (var i = 0; i < vocabSize; i++) {
    cum += p[i][0];
    if (r < cum) return i;
  }
  return 0;
}

// =====================================================================
// Markov chain sampling
// =====================================================================

function markovSelect(chain, key) {
  var total = chain.table_len[key];
  if (!total) return null;
  var idx = Math.floor(Math.random() * total);
  var acc = 0;
  var sub = chain[key];
  for (var token in sub) {
    acc += sub[token];
    if (acc > idx) return token;
  }
  return null;
}

function markovName(chain) {
  var numParts = parseInt(markovSelect(chain, 'parts'), 10);
  if (!numParts) numParts = 1;
  var parts = [];
  for (var p = 0; p < numParts; p++) {
    var targetLen = parseInt(markovSelect(chain, 'name_len'), 10);
    if (!targetLen) continue;
    var c = markovSelect(chain, 'initial');
    if (!c) continue;
    var name = c;
    while (name.length < targetLen) {
      c = markovSelect(chain, name[name.length - 1]);
      if (!c) break;
      name += c;
    }
    parts.push(name);
  }
  return parts.join(' ');
}

function markovNameHighOrder(chain, order) {
  var numParts = parseInt(markovSelect(chain, 'parts'), 10);
  if (!numParts) numParts = 1;
  var parts = [];
  for (var p = 0; p < numParts; p++) {
    var targetLen = parseInt(markovSelect(chain, 'name_len'), 10);
    if (!targetLen) continue;
    var name = null;
    for (var o = order; o >= 1; o--) {
      var key = (o === 1) ? 'initial' : ('initial_' + o);
      var val = markovSelect(chain, key);
      if (val !== null) { name = val; break; }
    }
    if (!name) continue;
    while (name.length < targetLen) {
      var c = null;
      for (var o = Math.min(order, name.length); o >= 1; o--) {
        var context = name.slice(-o);
        var next = markovSelect(chain, context);
        if (next !== null) { c = next; break; }
      }
      if (!c) break;
      name += c;
    }
    parts.push(name);
  }
  return parts.join(' ');
}

// =====================================================================
// RNN inference
// =====================================================================

function rnnSample(model, vocab, temperature) {
  var hiddenSize = model.W_hh.length;
  var vocabSize = vocab.vocab_size;
  var h = Array.from({ length: hiddenSize }, function() { return [0]; });
  var ix = vocab.char_to_ix['^'];
  var chars = [];

  for (var step = 0; step < 20; step++) {
    var x = Array.from({ length: vocabSize }, function(_, i) { return [i === ix ? 1 : 0]; });
    h = tanhM(matadd(matadd(matmul(model.W_xh, x), matmul(model.W_hh, h)), model.b_h));
    var y = matadd(matmul(model.W_hy, h), model.b_y);
    var p = colSoftmax(y, temperature);
    ix = sampleFromCol(p, vocabSize);
    var ch = vocab.ix_to_char[String(ix)];
    if (ch === '$') break;
    chars.push(ch);
  }
  if (chars.length === 0) return '';
  return chars[0].toUpperCase() + chars.slice(1).join('');
}

// =====================================================================
// LSTM inference
// =====================================================================

function lstmSample(model, vocab, temperature) {
  var hiddenSize = model.W_hf.length;
  var vocabSize = vocab.vocab_size;
  var h = Array.from({ length: hiddenSize }, function() { return [0]; });
  var c = Array.from({ length: hiddenSize }, function() { return [0]; });
  var ix = vocab.char_to_ix['^'];
  var chars = [];

  for (var step = 0; step < 20; step++) {
    var x = Array.from({ length: vocabSize }, function(_, i) { return [i === ix ? 1 : 0]; });
    var f = sigmoidM(matadd(matadd(matmul(model.W_xf, x), matmul(model.W_hf, h)), model.b_f));
    var ig = sigmoidM(matadd(matadd(matmul(model.W_xi, x), matmul(model.W_hi, h)), model.b_i));
    var g = tanhM(matadd(matadd(matmul(model.W_xg, x), matmul(model.W_hg, h)), model.b_g));
    c = matadd(elemMul(f, c), elemMul(ig, g));
    var o = sigmoidM(matadd(matadd(matmul(model.W_xo, x), matmul(model.W_ho, h)), model.b_o));
    h = elemMul(o, tanhM(c));
    var y = matadd(matmul(model.W_hy, h), model.b_y);
    var p = colSoftmax(y, temperature);
    ix = sampleFromCol(p, vocabSize);
    var ch = vocab.ix_to_char[String(ix)];
    if (ch === '$') break;
    chars.push(ch);
  }
  if (chars.length === 0) return '';
  return chars[0].toUpperCase() + chars.slice(1).join('');
}

// =====================================================================
// Transformer inference
// =====================================================================

function zeros2d(rows, cols) {
  return Array.from({ length: rows }, function() { return new Float64Array(cols); });
}

function matmul2d(A, B) {
  var M = A.length, N = B.length, P = B[0].length;
  var C = zeros2d(M, P);
  for (var i = 0; i < M; i++)
    for (var k = 0; k < N; k++)
      for (var j = 0; j < P; j++)
        C[i][j] += A[i][k] * B[k][j];
  return C;
}

function transpose2d(A) {
  var M = A.length, N = A[0].length;
  var T = zeros2d(N, M);
  for (var i = 0; i < M; i++)
    for (var j = 0; j < N; j++)
      T[j][i] = A[i][j];
  return T;
}

function addBias2d(A, b) {
  return A.map(function(row) { return row.map(function(v, j) { return v + b[j]; }); });
}

function layerNorm(X, gamma, beta) {
  var eps = 1e-5;
  return X.map(function(row) {
    var D = row.length, mean = 0;
    for (var i = 0; i < D; i++) mean += row[i];
    mean /= D;
    var v = 0;
    for (var i = 0; i < D; i++) v += (row[i] - mean) * (row[i] - mean);
    v /= D;
    var inv = 1 / Math.sqrt(v + eps);
    return row.map(function(val, i) { return gamma[i] * ((val - mean) * inv) + beta[i]; });
  });
}

function tfForward(indices, model, nHeads) {
  var T = indices.length;
  var dModel = model.W_emb[0].length;
  var dK = dModel / nHeads;

  // Embedding + PE
  var X = zeros2d(T, dModel);
  for (var t = 0; t < T; t++)
    for (var d = 0; d < dModel; d++)
      X[t][d] = model.W_emb[indices[t]][d] + model.PE[t][d];

  // Pre-norm block 1: LN -> Attention -> Residual
  var Xn = layerNorm(X, model.gamma_1, model.beta_1);
  var Q = addBias2d(matmul2d(Xn, model.W_Q), model.b_Q);
  var K = addBias2d(matmul2d(Xn, model.W_K), model.b_K);
  var V = addBias2d(matmul2d(Xn, model.W_V), model.b_V);

  var concat = zeros2d(T, dModel);
  for (var h = 0; h < nHeads; h++) {
    var Qh = Q.map(function(r) { return Array.from(r.slice(h*dK, (h+1)*dK)); });
    var Kh = K.map(function(r) { return Array.from(r.slice(h*dK, (h+1)*dK)); });
    var Vh = V.map(function(r) { return Array.from(r.slice(h*dK, (h+1)*dK)); });
    var scores = matmul2d(Qh, transpose2d(Kh));
    var scale = 1 / Math.sqrt(dK);
    for (var i = 0; i < T; i++)
      for (var j = 0; j < T; j++) {
        scores[i][j] *= scale;
        if (j > i) scores[i][j] = -1e9;
      }
    // Row softmax
    var attn = scores.map(function(row) {
      var mx = -Infinity;
      for (var i = 0; i < row.length; i++) if (row[i] > mx) mx = row[i];
      var e = row.map(function(v) { return Math.exp(v - mx); });
      var s = 0; for (var i = 0; i < e.length; i++) s += e[i];
      return e.map(function(v) { return v / s; });
    });
    var headOut = matmul2d(attn, Vh);
    for (var t = 0; t < T; t++)
      for (var k = 0; k < dK; k++)
        concat[t][h*dK + k] = headOut[t][k];
  }
  var attnOut = addBias2d(matmul2d(concat, model.W_O), model.b_O);
  for (var t = 0; t < T; t++)
    for (var d = 0; d < dModel; d++)
      X[t][d] += attnOut[t][d];

  // Pre-norm block 2: LN -> FFN -> Residual
  Xn = layerNorm(X, model.gamma_2, model.beta_2);
  var hidden = addBias2d(matmul2d(Xn, model.W1), model.b1);
  hidden = hidden.map(function(r) { return r.map(function(v) { return v > 0 ? v : 0; }); });
  var ffnOut = addBias2d(matmul2d(hidden, model.W2), model.b2);
  for (var t = 0; t < T; t++)
    for (var d = 0; d < dModel; d++)
      X[t][d] += ffnOut[t][d];

  // Final LN -> Output
  var Xf = layerNorm(X, model.gamma_f, model.beta_f);
  return addBias2d(matmul2d(Xf, model.W_out), model.b_out);
}

function tfSample(model, vocab, nHeads, temperature) {
  var startIx = vocab.char_to_ix['^'];
  var indices = [startIx];
  var chars = [];

  for (var step = 0; step < 20; step++) {
    var logits = tfForward(indices, model, nHeads);
    var last = logits[logits.length - 1];
    // Softmax with temperature
    var scaled = last.map(function(v) { return v / temperature; });
    var mx = -Infinity;
    for (var i = 0; i < scaled.length; i++) if (scaled[i] > mx) mx = scaled[i];
    var exps = scaled.map(function(v) { return Math.exp(v - mx); });
    var sum = 0; for (var i = 0; i < exps.length; i++) sum += exps[i];
    var probs = exps.map(function(v) { return v / sum; });
    var r = Math.random(), cum = 0, ix = 0;
    for (var i = 0; i < probs.length; i++) {
      cum += probs[i];
      if (r < cum) { ix = i; break; }
    }
    var ch = vocab.ix_to_char[String(ix)];
    if (ch === '$') break;
    chars.push(ch);
    indices.push(ix);
  }
  if (chars.length === 0) return '';
  return chars[0].toUpperCase() + chars.slice(1).join('');
}

// =====================================================================
// App
// =====================================================================

var markovData = null;
var rnnWeights = null;
var lstmWeights = null;
var tfWeights = null;
var categories = ['greek', 'norse', 'celtic'];

var tempSlider = document.getElementById('temp');
var tempVal = document.getElementById('temp-val');
var genBtn = document.getElementById('gen-btn');
var statusEl = document.getElementById('status');

tempSlider.addEventListener('input', function() {
  tempVal.textContent = parseFloat(tempSlider.value).toFixed(2);
});

function clearEl(el) {
  while (el.firstChild) el.removeChild(el.firstChild);
}

function fillList(ulId, names) {
  var ul = document.getElementById(ulId);
  clearEl(ul);
  for (var i = 0; i < names.length; i++) {
    if (!names[i]) continue;
    var li = document.createElement('li');
    li.textContent = names[i];
    ul.appendChild(li);
  }
}

function generate() {
  if (!markovData || !rnnWeights || !lstmWeights || !tfWeights) {
    statusEl.textContent = 'Error: not all data loaded yet';
    return;
  }
  var temperature = parseFloat(tempSlider.value);
  for (var ci = 0; ci < categories.length; ci++) {
    var cat = categories[ci];
    if (!markovData.order1[cat]) {
      console.error('Missing markov data for category:', cat, 'Available:', Object.keys(markovData.order1));
      continue;
    }
    var o1 = [], o3 = [], rnn = [], lstm = [], tf = [];
    for (var i = 0; i < 8; i++) {
      o1.push(markovName(markovData.order1[cat]));
      o3.push(markovNameHighOrder(markovData.order3[cat], 3));
      rnn.push(rnnSample(rnnWeights.models[cat], rnnWeights.vocab, temperature));
      lstm.push(lstmSample(lstmWeights.models[cat], lstmWeights.vocab, temperature));
      tf.push(tfSample(tfWeights.models[cat], tfWeights.vocab, tfWeights.n_heads, temperature));
    }
    fillList('o1-' + cat, o1);
    fillList('o3-' + cat, o3);
    fillList('rnn-' + cat, rnn);
    fillList('lstm-' + cat, lstm);
    fillList('tf-' + cat, tf);
  }
}

genBtn.addEventListener('click', generate);

// Load all 4 data files
var loaded = 0;
var totalFiles = 4;
function checkReady() {
  loaded++;
  statusEl.textContent = 'Loaded ' + loaded + '/' + totalFiles + ' files...';
  if (loaded === totalFiles) {
    genBtn.disabled = false;
    genBtn.textContent = 'Generate';
    statusEl.textContent = 'Ready \u2014 click Generate to compare all five methods';
    generate();
  }
}

var cacheBust = '?v=' + Date.now();

fetch('markov_chains.json' + cacheBust)
  .then(function(r) { return r.json(); })
  .then(function(data) { markovData = data; checkReady(); })
  .catch(function(err) { statusEl.textContent = 'Failed (markov): ' + err.message; });

fetch('rnn_weights.json' + cacheBust)
  .then(function(r) { return r.json(); })
  .then(function(data) { rnnWeights = data; checkReady(); })
  .catch(function(err) { statusEl.textContent = 'Failed (rnn): ' + err.message; });

fetch('lstm_weights.json' + cacheBust)
  .then(function(r) { return r.json(); })
  .then(function(data) { lstmWeights = data; checkReady(); })
  .catch(function(err) { statusEl.textContent = 'Failed (lstm): ' + err.message; });

fetch('transformer_weights.json' + cacheBust)
  .then(function(r) { return r.json(); })
  .then(function(data) { tfWeights = data; checkReady(); })
  .catch(function(err) { statusEl.textContent = 'Failed (transformer): ' + err.message; });
</script>
</body>
</html>
